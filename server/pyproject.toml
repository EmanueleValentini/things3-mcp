[project]
name = "things3-mcp"
version = "0.1.0"
description = "MCP server for Things 3 on macOS: sqlite reads, URL scheme + AppleScript writes, agent workspace"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["mcp>=2.0.0,<3"]

[project.scripts]
things3-mcp = "things3_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/things3_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
