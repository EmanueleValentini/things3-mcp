name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check the tag matches the version in the manifests
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PLUGIN=$(python3 -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          if [ "$TAG" != "$PLUGIN" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match plugin.json version $PLUGIN."
            exit 1
          fi

      - name: Run the tests before publishing anything
        run: uv sync --locked --dev && uv run --no-sync pytest -q
        working-directory: server

      - name: Extract this version's changelog section
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { capture = 1; next }
            capture && /^## \[/     { exit }
            capture                 { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for $VERSION."
            exit 1
          fi
          cat release-notes.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
